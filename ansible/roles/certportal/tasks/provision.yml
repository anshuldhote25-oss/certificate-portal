---
# Packages, users, folders, files, ports and services the portal needs.
- name: Install Java, Tomcat and curl
  ansible.builtin.apt:
    name: "{{ required_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the application user that owns the release archive
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create the release archive folder
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"
  loop:
    - "{{ app_base }}"
    - "{{ releases_dir }}"

- name: Create the database folder (writable by Tomcat)
  ansible.builtin.file:
    path: "{{ data_dir }}"
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: "0750"

- name: Create the systemd drop-in folder for Tomcat
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ tomcat_service }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Pass the environment label and data folder to Tomcat
  ansible.builtin.template:
    src: certportal.conf.j2
    dest: "/etc/systemd/system/{{ tomcat_service }}.service.d/certportal.conf"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Tomcat

- name: Flush handlers so Tomcat has the new settings before the deploy
  ansible.builtin.meta: flush_handlers

- name: Enable and start Tomcat
  ansible.builtin.service:
    name: "{{ tomcat_service }}"
    state: started
    enabled: true

- name: Wait until Tomcat listens on its port
  ansible.builtin.wait_for:
    port: "{{ tomcat_port }}"
    host: 127.0.0.1
    delay: 2
    timeout: 90
